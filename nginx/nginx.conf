worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server backend:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;

            # DA3 Question 1(c) Zero-Downtime Failover Configuration:
            # If an upstream container stops or errors out, transparently retry
            # the request on another active instance so zero client requests fail.
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
